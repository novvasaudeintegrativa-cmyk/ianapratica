.stat b{display:block;font-size:1.6rem;line-height:1}.stat span{font-size:.82rem;color:var(--muted)}

.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
input[type=search]{flex:1;min-width:220px;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit}
.btn{padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer;font:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.dim{background:var(--card);border:1px solid var(--line);border-radius:var(--r);border-top:4px solid var(--c);overflow:hidden}
.dim>button{all:unset;box-sizing:border-box;display:flex;gap:12px;width:100%;padding:16px;cursor:pointer;align-items:flex-start}
.dim>button:focus-visible{outline:2px solid var(--clay);outline-offset:-2px}
.num{flex:none;width:36px;height:36px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.9rem}
.dim h3{margin:0;font-size:1.02rem;line-height:1.3}.dim small{color:var(--muted);display:block;margin-top:2px}
.tag{font-size:.7rem;color:var(--c);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.chev{margin-left:auto;transition:transform .2s;flex:none;color:var(--muted)}
.dim[data-open=true] .chev{transform:rotate(180deg)}
.dim ol{display:none;margin:0;padding:0 16px 16px 48px;font-size:.92rem}
.dim[data-open=true] ol{display:block}.dim li{margin:6px 0}
mark{background:#ffe08a;color:#000;border-radius:3px;padding:0 2px}
.empty{padding:40px;text-align:center;color:var(--muted)}
footer{margin-top:30px;color:var(--muted);font-size:.85rem}
</style>

"Vertigens diante da liberdade e responsabilidade","itens":["Medo do \"e agora?\" caso o negócio finalmente decole","Vertigem de não saber o que fazer com tempo livre, caso ele apareça","Medo de que, sem a correria, sobre espaço pra pensar em coisas que evita","Receio da responsabilidade de manter um crescimento conquistado","Medo de descobrir que o problema nunca foi tempo, mas método","Vertigem diante da liberdade de escolher um caminho novo","Medo de ter que se reinventar de novo caso essa solução também não baste","Receio de perceber que dependia mais das desculpas do que da falta de solução","Medo de finalmente ter clareza sobre o que precisa mudar em si mesma","Vertigem de imaginar o negócio funcionando sem ela estar 100% do tempo presente"]},{"n":29,"nome":"Paradoxos Fundamentais","sub":"Contradições essenciais da experiência","itens":["Quer automação, mas teme que isso a torne \"menos essencial\"","Quer ser vista como autêntica, mas usa ferramentas pra parecer mais profissional","Busca simplicidade, mas desconfia de tudo que parece simples demais","Quer economizar tempo, mas resiste a mudar processos antigos","Deseja crescer, mas teme as exigências que o crescimento traz","Quer parecer forte e capaz, mas se sente frequentemente perdida","Valoriza controle, mas o controle excessivo é o que mais a sobrecarrega","Quer ajuda, mas tem dificuldade de confiar em quem oferece","Busca liberdade, mas associa liberdade a risco financeiro","Quer ser vista como atualizada, mas teme parecer \"artificial\" ao usar IA"]},{"n":30,"nome":"Tensões Primordiais","sub":"Polaridades que criam dinamismo","itens":["Controle versus delegação","Crescimento versus estabilidade conhecida","Autenticidade versus eficiência","Independência versus necessidade de apoio","Presença constante versus liberdade de tempo","Perfeccionismo versus produção consistente","Tradição (fazer do jeito que sempre fez) versus inovação (IA)","Segurança financeira versus investimento em algo novo","Identidade de \"faz tudo sozinha\" versus construção de sistema/equipe","Medo de mudar versus medo de continuar igual"]}]}],"frase":"\"Eu sei que preciso postar todo santo dia, mas não sobra tempo, nem cabeça, pra fazer isso sozinha.\"","dores":["Sentir que está sempre correndo atrás, nunca à frente (Dimensão 1 — Sombras Existenciais)","Medo de ficar pra trás enquanto todo mundo fala de IA (Dimensão 2 — Medos Fundamentais)","Achar que é \"burra\" com tecnologia, mesmo competente em outras áreas (Dimensão 3 — Medos Ocultos)","Já pagou curso/mentoria que não aplicou (Dimensão 6 — Feridas Emocionais)","Sensação de estar presa num ciclo sem conseguir ver a saída (Dimensão 27 — Feridas da Alma)"],"desejos":["Ter um \"time de IAs\" trabalhando como uma agência (Dimensão 8 — Fantasias Não Realizadas)","Recuperar tempo pra família e pra si mesma (Dimensão 10 — Desejos Nucleares)","Sentir-se capaz, não dependente de terceiros (Dimensão 7 — Necessidades Primais)","Sair sabendo aplicar, não só assistindo (padrão em várias dimensões de identidade/poder)","Provar pra quem duvidou que ela consegue evoluir (Dimensão 9 — Desejos Inconfessáveis)"],"gatilhos":["Turma com data marcada e vagas limitadas (29–30/ago) — urgência real, não artificial","Preço de entrada baixo (R$ 147) reduz o risco percebido de \"tentar mais uma vez\"","Prova concreta de que o método funciona (o próprio site foi feito com o que será ensinado)","Comparação direta com \"cursos comuns\" — 2 dias práticos vs. meses de teoria parada","Garantia implícita de suporte ao vivo, não abandono após a venda"]};
const COR={A:'--A',B:'--B',C:'--C',D:'--D',E:'--E'};
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let filtro=null,termo='',tudoAberto=false;
$('#frase').textContent=D.frase;
$('#top').innerHTML=[['Top 5 dores mais profundas','🔻',D.dores],['Top 5 desejos mais intensos','✨',D.desejos],['Top 5 gatilhos de decisão','⚡',D.gatilhos]]
 .map(([t,i,l])=>`<div class="panel"><h2><span aria-hidden="true">${i}</span>${t}</h2><ol>${l.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div>`).join('');
$('#blocos').innerHTML=D.blocks.map(b=>`<button class="stat" type="button" data-b="${b.id}" aria-pressed="false" style="--c:var(${COR[b.id]})"><b>${b.dims.length}</b><span>Bloco ${b.id} — ${esc(b.nome)}</span></button>`).join('');
function hl(s){if(!termo)return esc(s);const re=new RegExp('('+termo.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');return esc(s).replace(re,'<mark>$1</mark>')}
function render(){
  const t=termo.toLowerCase();let n=0;
  $('#grid').innerHTML=D.blocks.filter(b=>!filtro||b.id===filtro).flatMap(b=>b.dims.map(d=>({b,d}))).map(({b,d})=>{
    const itens=t?d.itens.filter(x=>x.toLowerCase().includes(t)||d.nome.toLowerCase().includes(t)):d.itens;
    if(t&&!itens.length)return '';n++;
    const open=tudoAberto||(t&&itens.length);
    return `<article class="dim" data-open="${open?'true':'false'}" style="--c:var(${COR[b.id]})"><button type="button" aria-expanded="${open?'true':'false'}"><span class="num">${d.n}</span><span><span class="tag">Bloco ${b.id} · ${esc(b.nome)}</span><h3>${hl(d.nome)}</h3><small>${esc(d.sub)}</small></span><svg class="chev" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button><ol>${itens.map(x=>`<li>${hl(x)}</li>`).join('')}</ol></article>`}).join('');
  $('#vazio').hidden=n>0;
}
$('#grid').addEventListener('click',e=>{const bt=e.target.closest('.dim>button');if(!bt)return;const a=bt.parentElement,o=a.dataset.open!=='true';a.dataset.open=o;bt.setAttribute('aria-expanded',o)});
$('#blocos').addEventListener('click',e=>{const s=e.target.closest('.stat');if(!s)return;filtro=filtro===s.dataset.b?null:s.dataset.b;document.querySelectorAll('.stat').forEach(x=>x.setAttribute('aria-pressed',x.dataset.b===filtro));render()});
$('#q').addEventListener('input',e=>{termo=e.target.value.trim();render()});
$('#exp').addEventListener('click',e=>{tudoAberto=!tudoAberto;e.target.textContent=tudoAberto?'Recolher tudo':'Expandir tudo';render()});
$('#tema').addEventListener('click',()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dark?'light':'dark'});
render();
</script>
