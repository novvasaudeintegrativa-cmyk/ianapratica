<body>
  <div class="brand"><span>IA </span>na Prática</div>
  <h1>Assista ao vídeo até o final — no fim, liberamos o acesso à página da imersão.</h1>

  <div class="player" id="player">
    <video id="vsl" playsinline webkit-playsinline preload="auto" autoplay
      poster="Videos/VSL/vsl-poster.jpg" aria-label="Vídeo de apresentação da imersão, com Leandro Carvalho">
      <source src="Videos/VSL/VSL_Leandro.mp4" type="video/mp4" />
    </video>
    <div class="bar" id="bar"></div>

    <div class="overlay" id="ov-som">
      <div class="icon"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg></div>
      <div class="txt">Toque para ativar o som</div>
    </div>

    <div class="overlay" id="ov-pause">
      <div class="row">
        <div class="msg">Você parou no meio! Falta pouco pra liberar o acesso à imersão. Continue assistindo até o final.</div>
        <svg class="stop" viewBox="0 0 100 100" aria-hidden="true">
          <polygon points="30,3 70,3 97,30 97,70 70,97 30,97 3,70 3,30" fill="#fff"/>
          <polygon points="31,8 69,8 92,31 92,69 69,92 31,92 8,69 8,31" fill="#d9262c"/>
          <g fill="#fff">
            <rect x="35" y="26" width="7" height="30" rx="3.5"/>

            <rect x="52" y="24" width="7" height="32" rx="3.5"/>
            <rect x="60.5" y="31" width="7" height="25" rx="3.5"/>
            <path d="M35 52h32.5v8c0 11-8 19-18 19s-17-6-20-14l-4-9c-1-3 3-5 5-2l4 5z"/>
          </g>
        </svg>
      </div>
      <div class="btn-continuar">Continuar assistindo</div>
    </div>
  </div>

  <div class="cta-wrap">
    <a class="btn-cta" id="btn-pagina" href="claudecode.html">Quero entrar na imersão</a>
  </div>

  <script>
    (function () {
      var v = document.getElementById('vsl');
      var player = document.getElementById('player');
      var ovSom = document.getElementById('ov-som');
      var ovPause = document.getElementById('ov-pause');
      var bar = document.getElementById('bar');
      var btn = document.getElementById('btn-pagina');
      var LIBERA_EM = 0.9; // libera o botão com 90% do vídeo
      var titulo = 'VSL Imersão Claude Code (página de vídeo)';
      var played = false, hit = {}, liberado = false, maxVisto = 0, semSom = false;

      // repassa UTMs pra página de vendas (mesma lógica do claudecode.html)
      try {
        var qs = new URLSearchParams(location.search), stored = {};
        try { var s = JSON.parse(localStorage.getItem('ncrm_camp') || 'null'); if (s && s.d) stored = s.d; } catch (e) {}
        var out = [];
        ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term'].forEach(function (k) {
          var val = qs.get(k) || stored[k];
          if (val) out.push(k + '=' + encodeURIComponent(val));
        });
        if (out.length) btn.setAttribute('href', btn.getAttribute('href') + '?' + out.join('&'));
      } catch (e) {}

      function crmVideo(type, percent) {
        window.postMessage({ source: 'ncrm-video', type: type, percent: percent, provider: 'html5', title: titulo, placement: 'pagina-video' }, '*');
      }

      function liberar() {
        if (liberado) return;
        liberado = true;
        btn.classList.add('show');
        if (window.fbq) fbq('trackCustom', 'VSLButtonUnlocked', { content_name: titulo });
      }

      // tenta autoplay COM som; se o navegador barrar, cai pro mudo + aviso "toque para ativar o som"
      function mudo() {
        semSom = true;
        v.muted = true;
        ovSom.classList.add('show');
        v.play().catch(function () {});
      }
      v.muted = false;
      var p = v.play();
      if (p && p.catch) p.catch(mudo);

      // clique no player: ativa o som (1º toque) ou pausa/retoma
      player.addEventListener('click', function () {
        if (semSom) {
          semSom = false;
          v.muted = false;
          ovSom.classList.remove('show');
          if (v.paused) v.play();
          return;
        }
        if (v.ended) return;
        if (v.paused) v.play(); else v.pause();
      });

      // pausado (e não terminado) -> "Continue a ver o vídeo" piscando
      v.addEventListener('pause', function () {
        if (!v.ended && !document.hidden) ovPause.classList.add('show');
      });
      v.addEventListener('play', function () {
        ovPause.classList.remove('show');
        if (played) return;
        played = true;
        if (window.fbq) fbq('trackCustom', 'VSLPlay', { content_name: titulo });
        crmVideo('play');
      });

      // progresso, métricas e liberação do botão aos 90%
      v.addEventListener('timeupdate', function () {
        if (!v.duration) return;
        var frac = v.currentTime / v.duration;
        if (v.currentTime > maxVisto) maxVisto = v.currentTime;
        bar.style.width = (frac * 100) + '%';
        [25, 50, 75, 95].forEach(function (m) {
          if (!hit[m] && frac * 100 >= m) {
            hit[m] = true;
            if (window.fbq) fbq('trackCustom', 'VSLProgress' + m, { content_name: titulo, percent: m });
            crmVideo('progress', m);
          }
        });
        if (frac >= LIBERA_EM) liberar();
      });
      v.addEventListener('ended', function () {
        ovPause.classList.remove('show');
        liberar();
        if (window.fbq) fbq('trackCustom', 'VSLComplete', { content_name: titulo });
        crmVideo('complete');
      });

      // sem pular pra frente do que a pessoa já assistiu
      v.addEventListener('seeking', function () {
        if (v.currentTime > maxVisto + 1) v.currentTime = maxVisto;
      });

      btn.addEventListener('click', function () {
        if (window.fbq) fbq('trackCustom', 'VSLButtonClick', { content_name: titulo });
      });
    })();
  </script>
